<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Emoji Lines</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <header id="ui">

        <div class="brand">

            <div class="brand-title">

                <span class="logo-white">
                    EMOJI
                </span>

                <span class="logo-pink">
                    LINES
                </span>

            </div>


            <div class="subtitle">

                DEJÁ UNA HUELLA CON TU
                <br>
                MOVIMIENTO

            </div>

        </div>


        <div id="controls">

            <button
                id="drawButton"
                type="button"
                class="control-button draw-button"
            >

                <span class="button-icon">
                    ▶
                </span>

                <span>
                    Modo: Dibujar
                </span>

            </button>


            <button
                id="saveButton"
                type="button"
                class="control-button save-button"
            >

                <span class="button-icon">
                    ▣
                </span>

                <span>
                    Guardar
                </span>

            </button>


            <button
                id="clearButton"
                type="button"
                class="control-button clear-button"
            >

                <span class="button-icon">
                    ✦
                </span>

                <span>
                    Limpiar
                </span>

            </button>

        </div>

    </header>


    <canvas id="canvas"></canvas>


    <div id="centerMessage">

        <div class="message-title">
            LUGAR TÁCTIL.
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
